# Switches the CRD to webhook conversion. v1alpha1 and v1beta1 have different
# shapes (fixed worker/api fields vs a dependency graph), so the API server
# cannot convert between them by rewriting apiVersion alone.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationupgrades.upgrades.lunadas.dev
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: system
          name: webhook-service
          path: /convert
      conversionReviewVersions:
      - v1
