# Sample upgrade request. Bumps both components to a new image; the operator
# rolls the worker (Component B) first, waits for it to become ready, then
# rolls the API (Component A). Image tags match the placeholder Deployments in
# manifests/ (nginx stand-ins), so this can be applied end-to-end for a demo.
apiVersion: upgrades.lunadas.dev/v1alpha1
kind: ApplicationUpgrade
metadata:
  name: upgrade-to-1.27
  namespace: job-system
spec:
  # Component B - Job Worker. Upgraded first.
  worker:
    deploymentRef:
      name: job-worker
      # namespace omitted: defaults to this ApplicationUpgrade's namespace
    image: nginx:1.27.0
    containerName: worker
  # Component A - Job API. Upgraded only after the worker is ready.
  api:
    deploymentRef:
      name: job-api
    image: nginx:1.27.0
    containerName: api
