# This rule is not used by the project application-upgrade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over upgrades.lunadas.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: application-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: applicationupgrade-admin-role
rules:
- apiGroups:
  - upgrades.lunadas.dev
  resources:
  - applicationupgrades
  verbs:
  - '*'
- apiGroups:
  - upgrades.lunadas.dev
  resources:
  - applicationupgrades/status
  verbs:
  - get
