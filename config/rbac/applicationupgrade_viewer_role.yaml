# This rule is not used by the project application-upgrade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to upgrades.lunadas.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: application-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: applicationupgrade-viewer-role
rules:
- apiGroups:
  - upgrades.lunadas.dev
  resources:
  - applicationupgrades
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - upgrades.lunadas.dev
  resources:
  - applicationupgrades/status
  verbs:
  - get
