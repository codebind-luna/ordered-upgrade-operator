# Service for Component B (internal). Reached by Component A over HTTP.
apiVersion: v1
kind: Service
metadata:
  name: job-worker
  namespace: job-system
  labels:
    app.kubernetes.io/name: job-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: job-processing-system
spec:
  selector:
    app.kubernetes.io/name: job-worker
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 80
      targetPort: 80
